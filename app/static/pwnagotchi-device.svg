<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
  <title id="title">Pwnagotchi uploader status panel</title>
  <desc id="desc">A compact e-ink style device panel showing handshake upload status.</desc>
  <rect width="560" height="360" rx="26" fill="#101827"/>
  <rect x="34" y="34" width="492" height="292" rx="18" fill="#edf3f8"/>
  <rect x="58" y="62" width="444" height="244" rx="8" fill="#f8fbfd" stroke="#9aa8b6" stroke-width="3"/>
  <g fill="#101827" font-family="Consolas, 'Courier New', monospace">
    <text x="82" y="103" font-size="26" font-weight="700">HASHCAT WPA UPLINK</text>
